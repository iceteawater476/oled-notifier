name: Build APK

# Builds a debug APK of the OLED Notify Relay app and attaches it as a
# downloadable artifact. Runs on GitHub's own servers, which have full
# access to Google's Android SDK/Maven repositories (unlike some sandboxed
# environments), so this is the easiest way to get a real .apk file
# without installing Android Studio yourself.
#
# HOW TO USE:
#   1. This file must live at .github/workflows/build-apk.yml relative to
#      your repository's ROOT -- GitHub only scans that exact top-level
#      path, not a nested one. Push the whole project (this .github folder,
#      android-app/, etc.) as one repository, keeping that layout intact.
#   2. Go to the repo's "Actions" tab on github.com. This workflow runs
#      automatically on every push, or click "Run workflow" to trigger it
#      manually (only appears once this file exists on your default
#      branch, e.g. main).
#   3. When it finishes (a few minutes), open the completed run and
#      download the "oled-notify-relay-debug-apk" artifact -- that's a zip
#      containing app-debug.apk. Transfer that .apk to your phone and
#      install it (you'll need to allow "install unknown apps" for
#      whichever app you use to open it, e.g. your file manager).

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oled-notify-relay-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
